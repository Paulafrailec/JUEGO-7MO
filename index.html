<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahorcado de vocabulario</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#23303b;--mu:#66717b;--ac:#7a4fb3;--ok:#2e8b57;--okbg:#e3f4ea;--ko:#c0392b;--kobg:#fbe6e3;--bd:#dcd8cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171b1f;--card:#222830;--tx:#eceff2;--mu:#9aa5af;--ac:#b794e6;--ok:#5cc48a;--okbg:#1e3a2b;--ko:#ef7b6e;--kobg:#412522;--bd:#38414a}}
:root[data-theme="dark"]{--bg:#171b1f;--card:#222830;--tx:#eceff2;--mu:#9aa5af;--ac:#b794e6;--ok:#5cc48a;--okbg:#1e3a2b;--ko:#ef7b6e;--kobg:#412522;--bd:#38414a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;padding:20px 12px}
main{width:100%;max-width:560px}
h1{font-size:1.3rem;margin:0 0 4px;text-align:center}
.sub{color:var(--mu);text-align:center;font-size:.9rem;margin-bottom:14px}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px 14px;box-shadow:0 2px 8px rgba(0,0,0,.06);text-align:center}
.hint{font-size:.95rem;color:var(--mu);margin:0}
.syn{font-size:1.6rem;font-weight:800;color:var(--ac);margin:4px 0 14px}
.lives{font-size:1.5rem;letter-spacing:4px;margin-bottom:12px}
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0 16px}
.l{width:30px;height:42px;border-bottom:3px solid var(--tx);font-size:1.6rem;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px}
.l.miss{color:var(--ko);border-color:var(--ko)}
.kb{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.k{width:40px;height:44px;border-radius:9px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit}
.k:hover:not(:disabled){border-color:var(--ac)}
.k.ok{background:var(--okbg);border-color:var(--ok)}
.k.ko{background:var(--kobg);border-color:var(--ko);opacity:.7}
.k:disabled{cursor:default}
.fb{min-height:26px;margin:14px 0 8px;font-weight:700}
.fb.ok{color:var(--ok)}.fb.ko{color:var(--ko)}
.btn{display:block;width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:13px;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit}
.btn.hide,.hide{display:none}
.score{font-size:3rem;font-weight:800;color:var(--ac);margin:6px 0}
.rev{text-align:left;margin:16px 0;font-size:.95rem}
.rev div{padding:8px 0;border-top:1px solid var(--bd)}
@media (max-width:400px){.k{width:34px;height:40px}.l{width:26px}}
</style>
</head>
<body>
<main>
<h1>🔤 Ahorcado de vocabulario</h1>
<div class="sub">Adivina la palabra a partir de su sinónimo</div>
<div id="game">
  <div class="meta"><span id="num"></span><span id="pts"></span></div>
  <div class="card">
    <p class="hint">La palabra que puede ser reemplazada por:</p>
    <p class="syn" id="syn"></p>
    <div class="lives" id="lives"></div>
    <div class="word" id="word"></div>
    <div class="kb" id="kb"></div>
    <div class="fb" id="fb"></div>
    <button class="btn hide" id="next">Siguiente palabra</button>
  </div>
</div>
<div id="end" class="card hide">
  <div style="font-size:2.4rem" id="emoji">🏆</div>
  <div class="score" id="final"></div>
  <div id="msg"></div>
  <div class="rev" id="rev"></div>
  <button class="btn" id="again">Jugar de nuevo</button>
</div>
</main>
<script>
const W=[
{w:"COMPUNGIDA",s:"Apesadumbrada"},
{w:"EMBELESADO",s:"Cautivado"},
{w:"INCREPAR",s:"Amonestar"},
{w:"HORTERA",s:"Chabacano"},
{w:"PEDANTE",s:"Sabiondo"},
{w:"DESASTRADO",s:"Harapiento"},
{w:"DESVALIDA",s:"Indefensa"}
];
const ABC="ABCDEFGHIJKLMNÑOPQRSTUVWXYZ",MAX=6,P=2;
let i,score,log,found,errs,over;
const $=id=>document.getElementById(id);
function start(){i=0;score=0;log=[];$("game").classList.remove("hide");$("end").classList.add("hide");round()}
function round(){
  const q=W[i];found=new Set();errs=0;over=false;
  $("num").textContent="Palabra "+(i+1)+" de "+W.length;
  $("pts").textContent="Puntaje: "+score+" / "+W.length*P;
  $("syn").textContent=q.s;
  $("fb").textContent="";$("fb").className="fb";
  $("next").classList.add("hide");
  $("next").textContent=i===W.length-1?"Ver resultado":"Siguiente palabra";
  const kb=$("kb");kb.innerHTML="";
  [...ABC].forEach(c=>{const b=document.createElement("button");b.className="k";b.textContent=c;b.dataset.c=c;b.onclick=()=>guess(c);kb.appendChild(b)});
  draw();
}
function draw(){
  const q=W[i];
  $("word").innerHTML=[...q.w].map(c=>{
    const show=found.has(c)||(over&&!found.has(c));
    const miss=over&&!found.has(c);
    return "<div class='l"+(miss?" miss":"")+"'>"+(show?c:"")+"</div>";
  }).join("");
  $("lives").textContent="❤️".repeat(MAX-errs)+"🖤".repeat(errs);
}
function guess(c){
  if(over)return;
  const q=W[i],b=[...$("kb").children].find(x=>x.dataset.c===c);
  if(!b||b.disabled)return;
  b.disabled=true;
  if(q.w.includes(c)){found.add(c);b.classList.add("ok")}
  else{errs++;b.classList.add("ko")}
  const won=[...q.w].every(x=>found.has(x));
  if(won||errs>=MAX){
    over=true;
    [...$("kb").children].forEach(x=>x.disabled=true);
    if(won){score+=P;$("fb").textContent="¡Muy bien! +"+P+" puntos";$("fb").classList.add("ok")}
    else{$("fb").textContent="Se acabaron las vidas. La palabra era "+q.w;$("fb").classList.add("ko")}
    log.push({w:q.w,s:q.s,good:won});
    $("pts").textContent="Puntaje: "+score+" / "+W.length*P;
    $("next").classList.remove("hide");
  }
  draw();
}
function finish(){
  $("game").classList.add("hide");$("end").classList.remove("hide");
  const max=W.length*P,pct=score/max;
  $("final").textContent=score+" / "+max+" puntos";
  $("emoji").textContent=pct>=.85?"🏆":pct>=.6?"👏":"💪";
  $("msg").textContent=pct>=.85?"¡Excelente dominio del vocabulario!":pct>=.6?"¡Buen trabajo! Repasa las que fallaste.":"¡Sigue practicando, tú puedes!";
  $("rev").innerHTML=log.map(l=>"<div>"+(l.good?"✅":"❌")+" <b>"+l.w+"</b> = "+l.s+"</div>").join("");
}
$("next").onclick=()=>{i++;i<W.length?round():finish()};
$("again").onclick=start;
document.addEventListener("keydown",e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const c=e.key.toUpperCase();
  if(c.length===1&&ABC.includes(c))guess(c);
  else if(e.key==="Enter"&&!$("next").classList.contains("hide"))$("next").click();
});
start();
</script>
</body>
</html>
